[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-crawler"
version = "1.0.0"
description = "Autonomous agentic web crawler with RAG and claim validation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "beautifulsoup4>=4.12.3",
    "playwright>=1.49.1",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.28",
    "sentence-transformers>=3.3.1",
    "chromadb>=0.5.23",
    "transformers>=4.47.1",
    "torch>=2.6.0",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "datasets>=3.2.0",
    "numpy>=2.2.1",
    "lxml>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "config*",
    "app*",
    "agents*",
    "crawler*",
    "indexer*",
    "retrieval*",
    "validation*",
    "llm*",
    "logging_setup*",
    "evaluation*",
]
